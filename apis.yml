name: Tradewind Markets
description: 'Tradewind Markets is a fintech company that operates a digital platform for precious
  metals, using blockchain and distributed-ledger technology to enable the trading, settlement, supply-chain
  management, and custody of physical commodities. Its VaultChain Gold and VaultChain Silver products
  represent investment-grade bullion held physically at the Royal Canadian Mint, with ownership tracked
  on a secure distributed ledger for real-time tracking and transparent auditability. Founded in 2016
  and adopted by institutions including the Royal Canadian Mint and Kitco, Tradewind was acquired by
  Wellfield Technologies in 2023. No public developer/API surface was found during enrichment.'
